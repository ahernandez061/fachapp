# Configuración del entorno local de Supabase (`supabase start`).
# Equivalente a `supabase init`; los valores omitidos usan los defaults del CLI.
project_id = "fachapp"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
# URL de la app en local (Vite). En producción se configura en el panel de Supabase.
site_url = "http://localhost:5180/fachapp/"
additional_redirect_urls = ["http://localhost:5180/fachapp/", "https://*.github.io/fachapp/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Google y X/Twitter se activan en la Fase 1 / Fase 3.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.external.twitter]
enabled = false
client_id = "env(SUPABASE_AUTH_X_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_X_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.x-verify]
verify_jwt = true

[functions.x-oauth-start]
verify_jwt = true

# Lo llama X al volver del login: no lleva JWT de Supabase.
[functions.x-oauth-callback]
verify_jwt = false

[functions.x-disconnect]
verify_jwt = true

[functions.send-push]
verify_jwt = true
